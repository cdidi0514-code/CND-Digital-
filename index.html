<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-card">
            <h1>😂 Random Joke Generator</h1>
            
            <div class="joke-display">
                <p id="jokeText" class="joke-text">Click the button to get a random joke!</p>
                <p id="jokeType" class="joke-type"></p>
            </div>

            <div class="button-group">
                <button id="generateBtn" class="btn btn-primary">Get a Joke</button>
                <button id="shareBtn" class="btn btn-secondary">Share</button>
                <button id="copyBtn" class="btn btn-secondary">Copy</button>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading joke...</p>
            </div>

            <div class="error" id="error" style="display: none;">
                <p id="errorMsg"></p>
            </div>

            <div class="joke-count">
                <p>Jokes Loaded: <span id="count">0</span></p>
            </div>

            <div class="categories">
                <label for="category">Select Category:</label>
                <select id="category">
                    <option value="any">Any</option>
                    <option value="general">General</option>
                    <option value="programming">Programming</option>
                    <option value="knock-knock">Knock-Knock</option>
                </select>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
